<style>
    html {
        scroll-behavior: smooth;
    }

    body {
        background-color: #08152E;
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    /* Better anchor positioning with sticky navbar */
    section {
        scroll-margin-top: 120px;
    }

    .liquid-glass {
        backdrop-filter: blur(40px);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card-hover:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(70, 224, 208, 0.4);
        transform: translateY(-5px);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .shimmer-button {
        position: relative;
        overflow: hidden;
    }

    .shimmer-button::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
            45deg,
            transparent,
            rgba(70, 224, 208, 0.2),
            transparent
        );
        transform: rotate(45deg);
        pointer-events: none;
        transition: all 0.6s ease;
    }

    .shimmer-button:hover::after {
        left: 100%;
    }

    .energy-wave {
        background: radial-gradient(
            circle at 50% 50%,
            rgba(70, 224, 208, 0.05) 0%,
            transparent 70%
        );
    }

    .neon-glow {
        box-shadow: 0 0 20px rgba(70, 224, 208, 0.3);
    }

    .heading-glow {
        text-shadow: 0 0 15px rgba(70, 224, 208, 0.4);
    }

    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 300,
            'GRAD' 0,
            'opsz' 24;
    }

    .parallax-layer {
        transition: transform 0.1s ease-out;
    }

    /* ===== MODERN SECTION TRANSITIONS ===== */

    .reveal {
        opacity: 0;
        transform: translateY(60px) scale(0.97);
        filter: blur(8px);

        transition:
            opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
            transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
            filter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }

    /* Floating navbar hover effect */

    nav a {
        position: relative;
    }

    nav a::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        width: 0%;
        height: 1px;
        background: #46E0D0;

        transition:
            width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
            left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    nav a:hover::after {
        width: 100%;
        left: 0;
    }

    /* Smooth hover scaling */

    a,
    button {
        transition:
            transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
            opacity 0.4s ease,
            background 0.4s ease,
            color 0.4s ease;
    }

    a:hover,
    button:hover {
        transform: translateY(-2px);
    }

    /* Smooth image zoom */

    img {
        transition:
            transform 1s cubic-bezier(0.16, 1, 0.3, 1),
            opacity 0.6s ease;
    }

    /* Floating cards animation */

    @keyframes floaty {
        0% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-12px);
        }

        100% {
            transform: translateY(0px);
        }
    }

    .floaty {
        animation: floaty 6s ease-in-out infinite;
    }
</style>

<script>
    // ===== PARALLAX EFFECT =====

    document.addEventListener('mousemove', (e) => {

        const layers = document.querySelectorAll('.parallax-layer');

        const x = (window.innerWidth - e.pageX * 2) / 100;
        const y = (window.innerHeight - e.pageY * 2) / 100;

        layers.forEach(layer => {

            const speed = layer.getAttribute('data-speed') || 1;

            layer.style.transform =
                `translateX(${x * speed}px) translateY(${y * speed}px)`;

        });

    });

    // ===== SECTION REVEAL =====

    const reveals = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver((entries) => {

        entries.forEach((entry) => {

            if (entry.isIntersecting) {

                entry.target.classList.add('active');

            }

        });

    }, {
        threshold: 0.15
    });

    reveals.forEach((section) => {
        observer.observe(section);
    });

    // ===== ULTRA SMOOTH NAVIGATION =====

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {

        anchor.addEventListener('click', function (e) {

            e.preventDefault();

            const target = document.querySelector(this.getAttribute('href'));

            if (target) {

                window.scrollTo({
                    top: target.offsetTop - 80,
                    behavior: 'smooth'
                });

            }

        });

    });

    // ===== ACTIVE NAV LINK =====

    const sections = document.querySelectorAll("section");
    const navLinks = document.querySelectorAll("nav a");

    window.addEventListener("scroll", () => {

        let current = "";

        sections.forEach(section => {

            const sectionTop = section.offsetTop;

            if (pageYOffset >= sectionTop - 200) {
                current = section.getAttribute("id");
            }

        });

        navLinks.forEach(link => {

            link.classList.remove("text-primary-container");

            if (link.getAttribute("href") === `#${current}`) {
                link.classList.add("text-primary-container");
            }

        });

    });
</script>
